<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluación · Biología 9</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero" style="padding-bottom:64px">
  <div class="wrap">
    <div class="brand"><a href="index.html"><img src="assets/logo.png" alt="Logo del colegio"></a></div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
</header>

<div class="progress hidden" id="progress"><div class="in">
  <span id="progTxt">0 / 0</span><div class="bar"><i id="progBar"></i></div><span class="timer" id="timer">00:00</span>
</div></div>

<main id="main">
  <form id="form" novalidate>
    <section class="card" id="idCard">
      <h2>Tus datos</h2>
      <p class="sub">Aparecerán en tu ticket. Revisa que tu correo esté bien escrito.</p>
      <div class="fields">
        <div><label class="f" for="name">Nombre completo</label><input type="text" id="name" autocomplete="name" placeholder="Ej: Ana María Gómez"><div class="err">Escribe tu nombre completo.</div></div>
        <div><label class="f" for="email">Correo electrónico</label><input type="email" id="email" autocomplete="email" placeholder="tucorreo@estudiantescambridge.edu.co"><div class="err">Escribe un correo válido.</div></div>
        <div><label class="f" for="course">Curso</label><select id="course"><option value="">Elige tu curso</option><option>9A</option><option>9B</option><option>9C</option></select><div class="err">Escribe tu curso.</div></div>
      </div>
      <div class="actions" style="margin-bottom:0"><button class="btn" type="button" id="startBtn">Comenzar →</button></div>
      <p class="note">Al comenzar se registra la hora de inicio y no podrás cambiar tus datos.</p>
    </section>
    <div id="quizPart" class="hidden">
      <div class="card who" id="who"></div>
      <div id="questions"></div>
      <div id="selfPart"></div>
      <div class="actions"><button class="btn gold" type="submit" id="submitBtn">Terminar y generar ticket ✓</button></div>
      <p class="note" id="missingNote"></p>
    </div>
  </form>

  <section class="card result hidden" id="result"></section>
</main>
<footer>Tu progreso se guarda automáticamente en este navegador.</footer>

<script src="js/jspdf.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/exams.js"></script>
<script src="js/ticket.js"></script>
<script src="js/app.js"></script>
</body>
</html>
